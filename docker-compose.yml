services:
  postgres:
    image: postgres:16-alpine
    container_name: securesign-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securesign"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - securesign-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securesign-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    networks:
      - securesign-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securesign-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    networks:
      - securesign-net

volumes:
  postgres_data:

networks:
  securesign-net:
    driver: bridge
